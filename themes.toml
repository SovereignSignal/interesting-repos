# Each [[theme]] fires in its `at` slots (["mon 13", ...] = weekday + UTC hour, one
# theme per slot) and becomes one Telegram message per firing, in the order below.
#
# query:   GitHub Search qualifiers — a string or a LIST of strings (results merged,
#          deduped). {since:Nd} expands to the date N days ago.
#          We use "breakout" queries — created in the last N days, sorted by stars —
#          which surface what's *trending now*, not the all-time famous repos.
#          Sorting is the `sort` field, NOT a sort: qualifier. Multiple topic:
#          qualifiers are AND-ed, so use one topic per theme.
# rank:    "stars" (top by stars, no AI) or "llm" (an Ollama model curates against
#          `profile`, filtering spam / star-farmed / low-effort repos).
# profile: what "interesting" means for this theme; guides the LLM curator.
# delta_days: set (e.g. 7) to source candidates by N-day star growth instead of
#             leaving them in search-stars order — repos with no prior snapshot
#             are dropped (the weekly Movers digest uses this). Optional.
#
# LLM curation + non-English translation both use Ollama (set OLLAMA_* env vars).

[[theme]]
key   = "trending"
name  = "Trending Overall"
emoji = "📈"
query = "created:>{since:90d} stars:>1000"
sort  = "stars"
count = 7
rank  = "llm"
catch_all = true
agent_skill_cap = 0
ai_cap = 0
at = ["mon 13", "thu 13"]
profile = "Breakout projects from the last few months that a broad developer audience genuinely finds interesting — novel tools, frameworks, models, or apps with real substance and momentum. Favor variety across domains."

[[theme]]
key   = "ai-agents"
name  = "AI & Agents"
emoji = "🤖"
query = ["topic:ai-agents created:>{since:90d}", "topic:llm created:>{since:90d}"]
sort  = "stars"
count = 7
rank  = "llm"
at = ["tue 13", "fri 13"]
profile = "Substantive AI agent frameworks, LLM applications, RAG/eval tooling, and agent infrastructure that engineers would actually use or learn from."

