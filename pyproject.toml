[project]
name = "interesting-repos-bot"
version = "0.1.0"
description = "Themed GitHub repo digests, delivered to Telegram."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
