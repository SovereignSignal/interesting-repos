[project]
name = "interesting-repos-bot"
version = "0.1.0"
description = "Themed GitHub repo digests, delivered to Telegram."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
